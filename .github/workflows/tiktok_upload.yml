name: Publish to TikTok

on:
  schedule:
    - cron: '0 16 * * *' # Daily at 16:00 UTC
  workflow_dispatch:  # Allows manual trigger

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Google Drive credentials file
        run: echo '${{ secrets.GOOGLEDRIVE_CREDENTIALS_JSON }}' > googledrive_credentials.json

      - name: Create TikTok credentials file
        run: echo '${{ secrets.TIKTOK_CREDENTIALS_JSON }}' > tiktok_credentials.json

      - name: Run TikTok uploader
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python tiktok_uploader.py

      - name: Log completion
        run: echo "TikTok publish job completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
