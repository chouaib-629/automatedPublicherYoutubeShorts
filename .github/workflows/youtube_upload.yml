name: YouTube Video Uploader

on:
    schedule:
        - cron: "30 16 * * *" # Daily at 16:30
    workflow_dispatch: # Allows manual trigger

jobs:
    upload:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Create YouTube credentials file
              run: echo '${{ secrets.YOUTUBE_CREDENTIALS_JSON }}' > youtube_credentials.json

            - name: Create Google Drive credentials file
              run: echo '${{ secrets.GOOGLEDRIVE_CREDENTIALS_JSON }}' > googledrive_credentials.json

            - name: Create settings.yaml for PyDrive
              run: |
                cat > settings.yaml << EOF
                client_config_backend: settings
                client_config:
                  client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
                  client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}

                save_credentials: True
                save_credentials_backend: file
                save_credentials_file: googledrive_credentials.json

                get_refresh_token: True

                oauth_scope:
                  - https://www.googleapis.com/auth/drive
                EOF

            - name: Run YouTube uploader
              env:
                  DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
                  YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
              run: python youtube_uploader.py
